name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "index.html"
      - "public/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.app.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate API deployment configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dfcgxbfrzwfmbdeceyog.supabase.co/functions/v1' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::notice::VITE_API_BASE_URL is not set. The frontend will be published without a connected API."
            exit 0
          fi
          if [[ "$VITE_API_BASE_URL" != https://* ]]; then
            echo "::error::VITE_API_BASE_URL must use HTTPS."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dfcgxbfrzwfmbdeceyog.supabase.co/functions/v1' }}
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build:frontend
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
