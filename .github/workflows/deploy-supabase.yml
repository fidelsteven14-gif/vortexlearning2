name: Deploy Supabase backend

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dfcgxbfrzwfmbdeceyog
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check deployment credentials
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the repository Actions secrets before deploying the backend."
            exit 1
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
      - name: Deploy API function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
